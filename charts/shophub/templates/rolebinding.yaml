{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shophub.fullname" . }}-shop-crs
  namespace: {{ .Values.kubernetes.namespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "shophub.fullname" . }}-shop-crs
subjects:
  - kind: ServiceAccount
    name: {{ include "shophub.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
