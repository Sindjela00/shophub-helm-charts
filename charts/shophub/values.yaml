# -- Deploys shophub-app's backend API (ShopHub.Api). The frontend isn't containerized yet
# (shophub-app's own CI only builds/publishes the backend image), so there's nothing for this
# chart to deploy for it yet — see that repo's CI for the current state.
replicaCount: 1

image:
  repository: ghcr.io/sindjela00/shophub-app
  # -- Defaults to .Chart.AppVersion when unset. No versioned release has been tagged yet, so
  # the default here is "latest" (also published by shophub-app's CI on every merge to
  # master) — pin this to a real semver tag once one exists.
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  # -- Defaults to the chart's fullname if empty.
  name: ""
  annotations: {}

# Grants this release's ServiceAccount permission to create/patch/delete Shop, Wallet, and
# DiscordChannel custom resources in kubernetes.namespace — required for the app's shop-site
# management API to work at all (KubernetesShopProvisioningService). Namespaced Role, not a
# ClusterRole: the app only ever touches CRs in its own configured namespace.
rbac:
  create: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: shophub.example.com
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

jwt:
  issuer: shophub-app
  audience: shophub-app-clients
  expiryMinutes: 60
  # -- Inline signing key (creates a Secret). Prefer existingSecret in production — it keeps
  # the key out of `helm install -f values.yaml` shell history and `helm get values` output.
  signingKey: ""
  existingSecret: ""
  existingSecretKey: SigningKey

database:
  # -- Inline Postgres connection string (creates a Secret). Prefer existingSecret in
  # production, same reasoning as jwt.signingKey above.
  connectionString: ""
  existingSecret: ""
  existingSecretKey: ConnectionString

grafana:
  # -- Cluster-internal only — Grafana has no public Ingress (see shophub-kube-state's Grafana
  # access-control values); the app's own /grafana-proxy route (GrafanaProvisioningService,
  # scoped Grafana access) is the only way a browser ever reaches it. Point this at the
  # kube-prometheus-stack Grafana Service DNS name, e.g.
  # "http://shophub-grafana.shophub.svc.cluster.local".
  baseUrl: ""
  # -- Org that holds every ShopHub end user and their per-shop folders, kept separate from
  # the default org's cluster/maintainer dashboards. Must match whatever name was used when
  # bootstrapping the org + service account (see BOOTSTRAP.md) — this chart doesn't create
  # either, since Grafana has no declarative way to provision an org-scoped service account
  # token.
  usersOrgName: "ShopHub Users"
  # -- AdminUser/AdminPassword/ServiceAccountToken keys, from the one-time bootstrap in
  # BOOTSTRAP.md. No inline equivalent (unlike jwt.signingKey/database.connectionString) —
  # these are provisioning-time credentials, not a single value worth typing into
  # `helm install -f`.
  existingSecret: ""
  existingSecretAdminUserKey: AdminUser
  existingSecretAdminPasswordKey: AdminPassword
  existingSecretServiceAccountTokenKey: ServiceAccountToken

kubernetes:
  # -- Namespace the app creates Shop/Wallet/DiscordChannel custom resources in — must match
  # wherever the shop-operator chart's operator is watching (that chart's own default is also
  # "shops").
  namespace: shops
  # -- Always true for an in-cluster deployment: makes the app use its ServiceAccount token
  # instead of trying to read a local kubeconfig, which won't exist in the pod.
  inCluster: true
  # -- Host a shop's NodePort Service is reachable at from outside the cluster (a node's
  # external IP, a load balancer in front of the nodes, "localhost" for Docker Desktop's local
  # Kubernetes, etc). No sensible default across environments — must be set per environment,
  # same as database/jwt secrets above aren't given real values here either.
  externalHost: ""

discord:
  # -- The bot's Discord application client id — public, not secret (it's baked into every
  # invite link a shop owner is handed). No sensible default; leave empty to disable the invite
  # link (the onboarding endpoints still work, just build an unusable URL).
  clientId: ""
  # -- Inline bot token (creates a Secret in this release's own namespace, read by this app via
  # a plain env var like jwt.signingKey/database.connectionString above). Prefer existingSecret
  # in production, same reasoning as those two.
  #
  # This chart, not shop-operator's, owns the Discord bot's credentials — shop-operator's
  # DiscordChannelReconciler reads the *same* Secret live via the Kubernetes API instead of
  # having its own copy (it already has cluster-wide `secrets: get` via its ClusterRole, so no
  # extra RBAC grant is needed for that cross-namespace read). If you change existingSecret,
  # nameOverride, or fullnameOverride here, update shop-operator's own
  # discord.secretName/secretNamespace values to match.
  botToken: ""
  # -- Only consumed by shop-operator (the fallback guild for shophub-app's own platform alert
  # channel and any shop that hasn't attached its own server yet) — this app has no use for it
  # itself, it's just carried in the same Secret since the two values are managed together.
  guildId: ""
  existingSecret: ""
  existingSecretBotTokenKey: DISCORD_BOT_TOKEN
  existingSecretGuildIdKey: DISCORD_GUILD_ID

# kube-prometheus-stack is a chart dependency (see Chart.yaml) providing the observability
# stack (spec 3.3). Disable if the cluster already has its own Prometheus/Grafana stack.
kube-prometheus-stack:
  enabled: true

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
