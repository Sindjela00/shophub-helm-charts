apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shop-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop-operator.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "shop-operator.serviceAccountName" . }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
          env:
            # Plain values, not secretKeyRef — this operator doesn't hold a copy of the bot
            # token in its own env at all, it reads the real Secret live via the Kubernetes API
            # each reconcile (see internal/controller/discordchannel_controller.go), using these
            # four to know where to look. See discord.secretName's comment in values.yaml for
            # why the credential lives in the shophub chart's namespace instead of this one's.
            - name: DISCORD_SECRET_NAMESPACE
              value: {{ .Values.discord.secretNamespace | quote }}
            - name: DISCORD_SECRET_NAME
              value: {{ .Values.discord.secretName | quote }}
            - name: DISCORD_SECRET_BOT_TOKEN_KEY
              value: {{ .Values.discord.secretBotTokenKey | quote }}
            - name: DISCORD_SECRET_GUILD_ID_KEY
              value: {{ .Values.discord.secretGuildIdKey | quote }}
            {{- if .Values.shopImage }}
            - name: SHOP_IMAGE
              value: {{ .Values.shopImage | quote }}
            {{- end }}
            {{- if .Values.shopRedisImage }}
            - name: SHOP_REDIS_IMAGE
              value: {{ .Values.shopRedisImage | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: probe
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
