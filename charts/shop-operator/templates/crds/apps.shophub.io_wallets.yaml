{{- if .Values.crds.install }}
# Mirrors shophub-shop-operator's config/crd/bases/apps.shophub.io_wallets.yaml exactly — see
# apps.shophub.io_shops.yaml in this same directory for why this lives under templates/ instead
# of Helm's crds/ folder.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wallets.apps.shophub.io
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: apps.shophub.io
  names:
    kind: Wallet
    listKind: WalletList
    plural: wallets
    singular: wallet
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Shop
          type: string
          jsonPath: .spec.shopRef
        - name: Address
          type: string
          jsonPath: .spec.address
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [shopRef, address]
              properties:
                shopRef:
                  type: string
                  minLength: 1
                address:
                  type: string
                  minLength: 1
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
{{- end }}
