{{- if and (not .Values.discord.existingSecret) .Values.discord.botToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shop-operator.discordSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  DISCORD_BOT_TOKEN: {{ .Values.discord.botToken | quote }}
  DISCORD_GUILD_ID: {{ .Values.discord.guildId | quote }}
{{- end }}
