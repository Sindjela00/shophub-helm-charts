# -- Number of operator replicas. The manager supports leader election (leaderElection.enabled)
# for running more than one, but a single controller-manager is the normal setup.
replicaCount: 1

image:
  repository: ghcr.io/sindjela00/shophub-shop-operator
  # -- Defaults to .Chart.AppVersion when unset. No versioned release has been tagged yet, so
  # the default here is "latest" (also published by the operator's CI on every merge to
  # master) — pin this to a real semver tag once one exists.
  tag: latest
  pullPolicy: IfNotPresent

# -- Enables controller-runtime leader election, so more than one replica can run safely
# (only one is ever active at a time). Off by default since replicaCount defaults to 1.
leaderElection:
  enabled: false

serviceAccount:
  create: true
  # -- Defaults to the chart's fullname if empty.
  name: ""
  annotations: {}

# CRDs (Shop, Wallet, DiscordChannel) live in this chart's crds/ directory, Helm's dedicated
# mechanism for CRDs (https://helm.sh/docs/chart_best_practices/custom_resource_definitions/).
# Helm installs them before any other template — with a discovery-cache refresh afterward, so
# resources of these Kinds created elsewhere in this same install/upgrade don't race the CRD's
# registration — and, deliberately, never upgrades or deletes them on `helm upgrade`/`helm
# uninstall`, so a botched release can't take the CRDs (and everyone's Shop/Wallet/DiscordChannel
# resources) down with it. To skip installing them (e.g. if they're already managed separately),
# use Helm's own `helm install --skip-crds` flag — there's no values-driven toggle for this,
# since crds/ is unconditional by design (upgrade/uninstall never touch it regardless).

# The Discord bot credentials the DiscordChannel controller uses to create each shop's alert
# channel. This chart does NOT own that Secret — the shophub chart does (it's shophub-app's own
# credential too, for the bot-invite/verify onboarding flow), and this operator reads it live
# via the Kubernetes API at reconcile time instead of injecting it into its own env. That only
# works because this operator's ClusterRole already grants cluster-wide `secrets: get` — no
# extra RBAC is needed for the cross-namespace read. secretName/secretNamespace below must match
# whatever the shophub chart's discord.existingSecret (or its computed default,
# "<shophub release fullname>-discord") and .Release.Namespace resolve to; if either chart's
# naming overrides diverge, update these to match.
discord:
  secretNamespace: shophub
  secretName: shophub-discord
  secretBotTokenKey: DISCORD_BOT_TOKEN
  secretGuildIdKey: DISCORD_GUILD_ID
  # -- Channel name for shophub-app's own platform-level alert channel (created in the default
  # guild above, alongside shophub-app's own metrics/alerts). Empty (the default) skips creating
  # it entirely — set this once you actually want platform alerting wired up.
  platformChannelName: ""

# -- Overrides the storefront image the Shop controller deploys for each Shop (SHOP_IMAGE env
# var) — this is NOT the operator's own image (see image.repository above). Left empty to use
# the operator's built-in default (ghcr.io/sindjela00/shophub-shop:latest).
shopImage: ""

# -- Overrides the Redis image used for "light" database-tier shops (SHOP_REDIS_IMAGE env
# var). Left empty to use the operator's built-in default (redis:7.2-alpine).
shopRedisImage: ""

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
