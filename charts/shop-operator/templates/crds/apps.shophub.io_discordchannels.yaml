{{- if .Values.crds.install }}
# Mirrors shophub-shop-operator's config/crd/bases/apps.shophub.io_discordchannels.yaml
# exactly — see apps.shophub.io_shops.yaml in this same directory for why this lives under
# templates/ instead of Helm's crds/ folder.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: discordchannels.apps.shophub.io
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: apps.shophub.io
  names:
    kind: DiscordChannel
    listKind: DiscordChannelList
    plural: discordchannels
    singular: discordchannel
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Shop
          type: string
          jsonPath: .spec.shopRef
        - name: Channel
          type: string
          jsonPath: .spec.channelName
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [shopRef, channelName]
              properties:
                shopRef:
                  type: string
                  minLength: 1
                channelName:
                  type: string
                  minLength: 1
            status:
              type: object
              properties:
                channelId:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
{{- end }}
