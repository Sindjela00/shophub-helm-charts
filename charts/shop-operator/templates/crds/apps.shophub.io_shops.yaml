{{- if .Values.crds.install }}
# Mirrors shophub-shop-operator's config/crd/bases/apps.shophub.io_shops.yaml exactly. Lives
# under templates/ (with this guard) rather than Helm's special crds/ directory so
# .Values.crds.install can actually turn it off — Helm's crds/ mechanism is unconditional, no
# values access at all. The resource-policy annotation keeps Helm's default template behavior
# (delete-on-uninstall) from taking existing Shop/Wallet/DiscordChannel resources down with it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shops.apps.shophub.io
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: apps.shophub.io
  names:
    kind: Shop
    listKind: ShopList
    plural: shops
    singular: shop
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Availability
          type: string
          jsonPath: .spec.availability
        - name: Database
          type: string
          jsonPath: .spec.databaseKind
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [name, walletAddress]
              properties:
                name:
                  type: string
                  minLength: 1
                availability:
                  type: string
                  enum: [standard, high]
                  default: standard
                walletAddress:
                  type: string
                  minLength: 1
                databaseKind:
                  type: string
                  enum: [standard, light]
                  default: standard
            status:
              type: object
              properties:
                phase:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
{{- end }}
