# CI pipeline — triggered on every PR against develop/master.
# TODO: chart-testing (ct lint/install) once there's a cluster in CI to install against.
name: CI
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      # shophub depends on kube-prometheus-stack (see charts/shophub/Chart.lock, pinned to a
      # specific version+digest) — both `helm lint` and `helm template` need it actually
      # present in charts/shophub/charts/, not just declared in Chart.yaml. `helm dependency
      # build` resolves repository aliases from Helm's local repo config, which a fresh runner
      # doesn't have — has to be registered first, every run.
      - name: Fetch chart dependencies
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          for chart in charts/*/; do
            helm dependency build "$chart"
          done

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            helm lint "$chart"
          done

      - name: Template charts (catches rendering errors lint alone can miss)
        run: |
          helm template shop-operator-test charts/shop-operator --namespace shops > /dev/null
          helm template shophub-test charts/shophub --namespace shophub \
            --set database.connectionString=ci-placeholder \
            --set jwt.signingKey=ci-placeholder > /dev/null
